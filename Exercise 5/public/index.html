<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.1.0/dist/css/materialize.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.1.0/dist/js/materialize.min.js"></script>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Exerfcise 5</title>
</head>
<body>

    <nav>
        <div class="nav-wrapper">
            <a href="#" class="brand-logo left">Todo App</a>
        </div>
    </nav>

    <div class="container">
        <div class="col">
            <form id="todoForm">
                <label>Name:</label>
                <input type="text" id="userInput" placeholder="Enter your name">

                <br><br>

                <label>Todo:</label>
                <input type="text" id="todoInput" placeholder="Enter a todo">

                <br><br>

                <button id="submit-data" class="btn" type="submit">Add</button>
            </form>
            <p id="message"></p>
        </div>
        
        <div class="col">
            <label>Search:</label>
            <form id="searchForm">
                <input type="text" id="searchInput" placeholder="Search a user">
                
                <br><br>

                <button id="search" class="btn">Search</button>
            </form>
            <ul id="todoList"></ul>
            <button id="deleteUser" class="btn" style="display: none;">Delete</button>
        </div>
    </div>
</body>
</html>
