<!DOCTYPE html>

<head>

    <script src="js/register.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form id="registerForm">

            <br><br>

        </form>
        <p id="error"></p>
    </div>
</body>
